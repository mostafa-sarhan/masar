# Local development database: MongoDB as a single-node replica set (transactions need one).
#   docker compose up -d        start (data persists in the "masar-mongo-data" volume)
#   docker compose down         stop (keeps data);  add -v to wipe it
# Connect with: mongodb://localhost:27018/masar?directConnection=true
# The host port defaults to 27018 so it never clashes with a locally installed mongod; set MONGO_PORT to change it.
name: masar-dev

services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    # Initiates the replica set on first start, then reports healthy once this node is primary.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }; db.hello().isWritablePrimary || quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
    name: masar-mongo-data
