# Production stack, one instance per compose project (see docs/DEPLOY.md):
#   deploy/deploy.sh prod    → project masar-prod, settings in .env.prod
#   deploy/deploy.sh demo    → project masar-demo, settings in .env.demo
#
# Each instance has its own MongoDB, network and volumes (named after the project), so instances never
# share data with each other or with other apps on the server. Only the web container publishes a port,
# on 127.0.0.1:${WEB_PORT}; the host's nginx terminates TLS and forwards to it. The web container serves
# the app and proxies /api to the API container. Every service has a memory cap.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    # The keyfile (needed for auth on a replica set) must be owned by mongodb and not world-readable.
    entrypoint:
      - bash
      - -c
      - |
        cp /run/secrets/mongo-keyfile /tmp/keyfile && chmod 400 /tmp/keyfile && chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/keyfile --wiredTigerCacheSizeGB ${MONGO_CACHE_GB:-0.25}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DB: masar
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ${MONGO_KEYFILE}:/run/secrets/mongo-keyfile:ro
      - ./deploy/mongo/create-app-user.js:/docker-entrypoint-initdb.d/create-app-user.js:ro
    # Initiates the replica set on first start; healthy once this node is primary.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }; db.hello().isWritablePrimary || quit(1)"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args: { APP_VERSION: "${APP_VERSION:-dev}" }
    image: masar-api:${APP_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/masar?replicaSet=rs0&authSource=masar
      JWT_SECRET: ${JWT_SECRET}
      # Same origin: the browser calls https://${DOMAIN}/api.
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      COOKIE_PATH_PREFIX: /api
      # Host nginx + the web container's nginx.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      RATE_LIMIT_STORE: mongo
      RUN_JOBS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${COMPOSE_PROJECT_NAME:-masar}
      APP_VERSION: ${APP_VERSION:-dev}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-demo}
      DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-}
      DEMO_WHATSAPP: ${DEMO_WHATSAPP:-}
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_DEMO_URL: ${VITE_DEMO_URL:-}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    image: masar-web:${APP_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    read_only: true
    # nginx runs as uid 101 (nginx-unprivileged); the template is rendered into conf.d at start.
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    depends_on: [api]
    environment:
      SENTRY_ORIGIN: ${SENTRY_ORIGIN:-}
    ports:
      - "127.0.0.1:${WEB_PORT}:8080"
    networks: [internal]

  # One backup of the app database into ${BACKUP_DIR} (run by cron: deploy/backup-now.sh), 14 days kept.
  backup:
    profiles: [tools]
    image: mongo:7.0
    logging: *logging
    mem_limit: 256m
    entrypoint: ["/scripts/backup.sh", "once"]
    environment:
      MONGO_BACKUP_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/masar?replicaSet=rs0&authSource=masar
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ${BACKUP_DIR}:/backups
    networks: [internal]

volumes:
  mongo-data:

networks:
  internal:
