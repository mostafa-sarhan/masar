# Masar demo (masar-demo, DEMO_MODE=true) — Docker compose project masar-demo, web container on 127.0.0.1:8091.
# The app and its API (/api) are on this one origin. Everything for this app lives in /opt/masar.
# TLS is added by: certbot --nginx -d demo.masar.mostafasarhan.tech --redirect
server {
    listen 80;
    listen [::]:80;
    server_name demo.masar.mostafasarhan.tech;

    # Browsers go straight to HTTPS for a year after the first visit (no includeSubDomains).
    # Sent on HTTPS only (certbot moves this block to listen 443 and adds the HTTP redirect).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Excel imports (the API accepts up to 2 MB)
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append): the client's address, so it can't be spoofed past the rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
